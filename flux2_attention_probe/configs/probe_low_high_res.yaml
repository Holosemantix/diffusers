backend: npu
diffusers_src: ../diffusers/src
output_dir: outputs/low_high_res
low_res: 512
high_res: 768
source: path/to/source.png
refs:
  - path/to/ref1.png
  - path/to/ref2.png
  - path/to/ref3.png
prompt: "Edit the source image using identity, clothing, and background references."
reference_roles:
  R1: identity
  R2: clothing
  R3: background
model:
  model_id: /home/ma-user/work/models/FLUX.2-klein-4B
  cache_dir: null
  local_files_only: true
  prefer_component_paths: false
  dtype: bfloat16
  offload: false
  low_cpu_mem_usage: true
local_paths:
  flux2_tokenizer_path: /home/ma-user/work/models/FLUX.2-klein-4B/tokenizer
  flux2_model_path: /home/ma-user/work/models/FLUX.2-klein-4B/flux-2-klein-4b.safetensors
  flux2_text_encoder_path: /home/ma-user/work/models/FLUX.2-klein-4B/text_encoder
  flux2_ae_path: /home/ma-user/work/models/FLUX.2-klein-4B/vae/diffusion_pytorch_model.safetensors
probe:
  save_full_attention: false
  save_block_attention: true
  block_size: 64
  sample_layers: [0, 8, 16]
  sample_heads: [0, 1, 2, 3]
  sample_steps: [0, 1]
  stream_to_disk: true
  max_query_tokens_per_record: 1024
generation:
  height: 512
  width: 512
  num_inference_steps: 2
  guidance_scale: 1.0
  seed: 0

